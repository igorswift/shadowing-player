<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Кино · Shadowing Player</title>
<style>
  :root { color-scheme: dark; font: 100%/1.5 "DM Sans",system-ui,sans-serif; background: #0a0a0f; color: #e8e8ed; --line: #3a3a4a; --muted: #8c8c9d; --accent: #6ee7b7; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: min(100% - 32px, 960px); margin: 26px auto 36px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 18px; border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 24px; }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(1.45rem, 5vw, 2rem); letter-spacing: -.035em; }
  a { color: var(--accent); text-underline-offset: 4px; }
  button, input { font: inherit; }
  button { min-height: 44px; padding: 8px 14px; background: #222823; color: inherit; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--accent); color: #18200e; border-color: transparent; font-weight: 650; }
  .muted, small { color: var(--muted); }
  #setup { max-width: 640px; }
  #setup > p { margin-bottom: 18px; }
  .fields { display: grid; gap: 12px; }
  label.field { display: grid; gap: 5px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
  input[type=file] { width: 100%; color: var(--muted); }
  input::file-selector-button { min-height: 36px; margin-right: 8px; padding-inline: 10px; border: 1px solid var(--line); border-radius: 6px; background: #222823; color: #f5f6ee; }
  details { margin: 16px 0; }
  details label { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); }
  #feedback, #playerError { color: #ffd19a; }
  #feedback:empty, #playerError:empty { display: none; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .setup-actions { margin: 14px 0; }
  #player { background: #1a1e1b; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  #player:fullscreen { display: flex; flex-direction: column; justify-content: center; padding: 0 max(12px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(12px, env(safe-area-inset-left)); background: #141716; overflow: auto; }
  #player:fullscreen video { max-height: 68dvh; flex-shrink: 1; min-height: 0; }
  video { display: block; width: 100%; max-height: 64dvh; aspect-ratio: 16 / 9; object-fit: contain; background: #080a09; }
  .screen { position: relative; }
  #captions { position: absolute; bottom: 6%; left: 5%; width: 90%; margin: 0; text-align: center; pointer-events: none; font-size: clamp(1rem, 3vw, 1.65rem); line-height: 1.4; }
  #captionText { pointer-events: auto; }
  .caption-word { display: inline; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  .caption-word:hover, .caption-word:focus-visible { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: .15em; }
  #captionText { color: #fff; background: rgba(0,0,0,.8); padding: .15em .35em; box-decoration-break: clone; -webkit-box-decoration-break: clone; overflow-wrap: anywhere; }
  #player:fullscreen .screen { min-height: 0; flex-shrink: 1; }
  .controls { padding: 12px; display: grid; gap: 10px; }
  .time { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 0; height: 32px; accent-color: var(--accent); cursor: pointer; }
  .review { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
  .review button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  #translation { overflow-wrap: anywhere; color: var(--accent); }
  #change { margin-left: auto; }
  @media (max-width: 480px) {
    main { width: min(100% - 20px, 960px); margin-top: 12px; }
    .controls { padding: 10px; }
    #change { margin-left: 0; }
  }
  body.watching main { margin: 0 auto; height: 100dvh; width: min(100%, 960px); display: flex; flex-direction: column; }
  body.watching header { display: none; }
  body.watching #player { display: flex; flex-direction: column; height: 100%; border-radius: 0; }
  body.watching .screen { flex: 1 1 0; min-height: 0; }
  body.watching video, #player:fullscreen video { height: 100%; max-height: none; }
  body.watching .controls { flex: 0 0 auto; max-height: 70dvh; overflow-y: auto; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #player:fullscreen { height: 100dvh; width: 100%; justify-content: flex-start; overflow: hidden; }
  #movieName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 65%; }
  .speed-controls { display: inline-flex; align-items: center; gap: 4px; }
  #speed { min-width: 3.8em; text-align: center; font-variant-numeric: tabular-nums; }
  #wakeStatus { color: var(--muted); font-size: .8rem; }
  #wakeStatus:empty { display: none; }
  @media (max-height: 500px) and (orientation: landscape) {
    .controls { gap: 4px; padding: 4px 10px; }
    .review { gap: 4px; padding-top: 4px; }
    .controls button { min-height: 36px; padding: 4px 10px; }
    input[type=range] { height: 24px; }
    #change { margin-left: auto; }
  }
  body.watching #player { background: #0a0a0f; border: 0; }
  body.watching .screen { flex: 1 1 45%; }
  body.watching .controls { display: flex; flex-direction: column; flex: 1 1 55%; min-height: 0; max-height: none; overflow: hidden; gap: 8px; }
  .controls > * { flex-shrink: 0; }
  .controls .phrase-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  #captions { position: static; width: 100%; margin: 0; text-align: left; pointer-events: auto; font-size: clamp(1.1rem, 3vw, 1.8rem); }
  #captionText { background: none; padding: 0; color: #e8e8ed; }
  .caption-line + .caption-line { border-top: 1px solid #1e1e2e; margin-top: 12px; padding-top: 12px; }
  button, input::file-selector-button { background: #14141f; color: #e8e8ed; border-color: #3a3a4a; }
  .primary { background: #2d4a3e; color: #6ee7b7; border-color: #6ee7b7; }
  .actions > button, .speed-controls button { border-radius: 24px; font-size: .8rem; min-height: 34px; padding: 4px 12px; }
  .transport { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-radius: 20px; overflow: hidden; }
  .transport button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 0; border: 0; border-right: 1px solid #0a0a0f; min-height: 72px; padding: 7px 2px; font-size: .75rem; }
  .transport .icon { font-size: 1.3rem; line-height: 1.3; }
  .transport button[aria-pressed=true] { background: #2d4a3e; color: #6ee7b7; }
  #phraseInfo, #speed, .time { font-family: "JetBrains Mono",monospace; font-size: .75rem; }
  #translation { margin-top: 10px; }
  @media (max-height: 500px) and (orientation: landscape) {
    body.watching #player { flex-direction: row; }
    body.watching .screen { flex: 1 1 55%; }
    body.watching .controls { flex: 1 1 45%; padding: 6px; }
    .transport button { min-height: 52px; }
    .actions { gap: 4px; }
    .actions > button, .speed-controls button { min-height: 30px; padding: 2px 8px; }
    #movieName { display: none; }
  }
  .controls .caption-word { display: inline; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; color: inherit; font: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Кино <small>· Shadowing Player</small></h1>
    <a href="./index.html">Shadowing Player</a>
  </header>

  <section id="setup" aria-label="Загрузка фильма">
    <p class="muted">Открой фильм и JSON с таймкодами. Смотри на английском и возвращайся к любой реплике.</p>
    <div class="fields">
      <label class="field">Фильм на английском <input id="movieFile" type="file" accept="video/*,.mp4,.m4v,.mov,.webm,.mkv"></label>
      <label class="field">Таймкоды реплик <input id="transcriptFile" type="file" accept=".json,application/json"></label>
    </div>
    <details>
      <summary>Подготовить JSON или добавить русский перевод</summary>
      <label class="field">Русские субтитры к этой версии фильма (SRT) <input id="subtitleFile" type="file" accept=".srt"></label>
      <small>Субтитры используются для сопоставления по времени. Перевод появится по кнопке RU.</small>
      <div class="actions setup-actions"><button id="export" type="button" disabled>Скачать JSON с репликами</button></div>
    </details>
    <div class="actions setup-actions"><button class="primary" id="open" type="button" disabled>Открыть фильм</button></div>
    <p id="feedback" role="status"></p>
  </section>

  <section id="player" aria-label="Видеоплеер" hidden>
    <div class="screen">
      <video id="video" playsinline preload="metadata" aria-label="Фильм"></video>
    </div>
    <div class="controls">
      <div class="time"><span id="movieName"></span><span id="time"></span></div>
      <div class="actions">
        <div class="speed-controls" role="group" aria-label="Скорость воспроизведения">
          <button id="slower" type="button" aria-label="Уменьшить скорость">−</button>
          <output id="speed" aria-live="polite">1×</output>
          <button id="faster" type="button" aria-label="Увеличить скорость">+</button>
        </div>
        <button id="repeat" type="button" disabled>Разобрать фразу</button>
        <button id="en" type="button" aria-label="Английские субтитры" aria-pressed="true">EN</button>
        <button id="ru" type="button" aria-label="Русский перевод" aria-pressed="false">RU</button>
        <button id="fullscreen" type="button" hidden>На весь экран</button>
        <button id="change" type="button">Файлы</button>
      </div>
      <input id="timeline" type="range" min="0" max="1" value="0" step="0.1" aria-label="Позиция фильма" disabled>
      <div class="time" id="phraseInfo" aria-live="polite"></div>
      <div class="phrase-area">
        <p id="captions" lang="en" hidden><span id="captionText"></span></p>
        <p id="translation" lang="ru" aria-live="polite" hidden></p>
      </div>
      <div class="actions"><button class="primary" id="continue" type="button">Продолжить фильм</button></div>
      <div id="review" class="transport">
        <button id="previous" type="button" aria-label="Предыдущая фраза"><span class="icon" aria-hidden="true">⏮</span>Prev</button>
        <button id="again" type="button"><span class="icon" aria-hidden="true">↻</span>Replay</button>
        <button id="play" type="button"><span class="icon" aria-hidden="true">▶</span><span id="playLabel">Play</span></button>
        <button id="split" type="button" aria-pressed="false"><span class="icon" aria-hidden="true">⛓</span><span id="splitLabel">Split</span></button>
        <button id="lock" type="button" aria-pressed="false"><span class="icon" aria-hidden="true">🔒</span><span id="lockLabel">Lock</span></button>
        <button id="next" type="button" aria-label="Следующая фраза"><span class="icon" aria-hidden="true">⏭</span>Next</button>
      </div>
      <p id="wakeStatus" role="status"></p>
      <p id="playerError" role="status"></p>
    </div>
  </section>
</main>
<script>
"use strict";

const $ = id => document.getElementById(id);
const video = $("video");
const timeline = $("timeline");
const player = $("player");
const movieInput = $("movieFile");
const transcriptInput = $("transcriptFile");
const subtitleInput = $("subtitleFile");
let phrases = [];
let reviewIndex = -1;
let reachedEnd = false;
let wordPlayback;
let renderedCaption;
let splitCount = 0;
let splitLock = false;
let reviewLastIndex = -1;
let objectUrl;
let positionKey;
let lastSavedAt = 0;
let frame;
let scrubbing = false;
let captionsVisible = true;
let translationVisible = false;
let displayedPhraseIndex = -1;
let playbackSpeed = 1;
let wakeLock;
let wakePending = false;
let wakeSession = 0;

function premierePhrases(data) {
  const results = [];
  const translations = Array.isArray(data.translations) ? data.translations : [];
  let translationIndex = 0;
  let pending;
  let previousSegmentSpeaker;
  const close = () => {
    if (!pending) return;
    const { start, end, text, translated, words } = pending;
    results.push({ start, end, words, en: text.join(" "), ...(translated.every(Boolean) && { ru: translated.join(" ") }) });
    pending = undefined;
  };
  for (const segment of data.segments) {
    const words = (segment?.words ?? []).filter(word =>
      word?.type === "word" && typeof word.text === "string" && word.text.trim());
    if (!words.length) continue;
    const speaker = segment.speaker;
    if (pending && ((speaker && previousSegmentSpeaker && speaker !== previousSegmentSpeaker) ||
      words[0].start - pending.end >= 1.5)) close();
    previousSegmentSpeaker = speaker;
    for (const [index, word] of words.entries()) {
      if (!Number.isFinite(word.start) || word.start < 0 || !Number.isFinite(word.duration) || word.duration < 0) {
        throw new Error("В транскрипте Premiere есть неверные таймкоды слов.");
      }
      pending ??= { start: word.start, end: word.start, text: [], translated: [], words: [] };
      pending.end = Math.max(pending.end, word.start + word.duration);
      pending.text.push(word.text.trim());
      pending.words.push({ text: word.text.trim(), start: word.start, end: word.start + word.duration });
      if (word.eos || index === words.length - 1) {
        const translation = translations[translationIndex++];
        pending.translated.push(typeof translation === "string" ? translation.trim() : "");
      }
      if (word.eos) close();
    }
  }
  close();
  return results;
}

function parseTranscript(data) {
  const entries = Array.isArray(data?.phrases) ? data.phrases :
    Array.isArray(data?.segments) ? premierePhrases(data) : null;
  if (!entries?.length) throw new Error("В JSON нет реплик. Выбери транскрипт Premiere или JSON из этого плеера.");
  return entries.map((phrase, index) => {
    const { start, end, en, ru } = phrase ?? {};
    if (!Number.isFinite(start) || start < 0 || !Number.isFinite(end) || end <= start ||
      typeof en !== "string" || !en.trim()) {
      throw new Error(`Проверь текст и таймкод реплики №${index + 1}.`);
    }
    const words = Array.isArray(phrase.words) ? phrase.words.filter(word =>
      typeof word?.text === "string" && word.text.trim() &&
      Number.isFinite(word.start) && Number.isFinite(word.end) &&
      word.start >= start && word.end > word.start && word.end <= end
    ).map(word => ({ text: word.text.trim(), start: word.start, end: word.end }))
      .sort((a, b) => a.start - b.start) : [];
    return { start, end, ...(words.length && { words }), en: en.trim(), ...(typeof ru === "string" && ru.trim() && { ru: ru.trim() }) };
  }).sort((a, b) => a.start - b.start);
}

function phraseAt(entries, time) {
  let low = 0;
  let high = entries.length;
  while (low < high) {
    const mid = Math.floor((low + high) / 2);
    if (entries[mid].start <= time) low = mid + 1;
    else high = mid;
  }
  const latest = low - 1;
  // Overlapping dialogue can leave an earlier line active after the latest one ends.
  for (let index = latest; index >= 0 && entries[index].maxEnd > time; index--) {
    if (entries[index].end > time) return index;
  }
  return latest;
}

function readSrt(text) {
  const stamp = "(\\d{2,}):(\\d{2}):(\\d{2})[,.](\\d{3})";
  const timing = new RegExp(`^${stamp}\\s*-->\\s*${stamp}(?:\\s.*)?$`);
  const seconds = ([h, m, s, ms]) => Number(h) * 3600 + Number(m) * 60 + Number(s) + Number(ms) / 1000;
  const cues = [];
  for (const block of text.trim().split(/\r?\n[ \t]*\r?\n/)) {
    const lines = block.split(/\r?\n/);
    const index = lines.findIndex(line => timing.test(line.trim()));
    if (index < 0) continue;
    const times = lines[index].trim().match(timing);
    const start = seconds(times.slice(1, 5));
    const end = seconds(times.slice(5, 9));
    const ru = lines.slice(index + 1).join(" ").replace(/<[^>]*>/g, "").trim();
    if (ru && end > start) cues.push({ start, end, ru });
  }
  if (!cues.length) throw new Error("В SRT нет русских реплик с таймкодами.");
  return cues.sort((a, b) => a.start - b.start);
}

function addSubtitles(entries, cues) {
  const assigned = entries.map(() => []);
  let first = 0;
  for (const cue of cues) {
    while (first < entries.length && entries[first].end <= cue.start) first++;
    let mostOverlap = 0;
    let best = -1;
    for (let i = first; i < entries.length && entries[i].start < cue.end; i++) {
      const overlap = Math.min(cue.end, entries[i].end) - Math.max(cue.start, entries[i].start);
      if (overlap > mostOverlap) {
        mostOverlap = overlap;
        best = i;
      }
    }
    if (best >= 0) assigned[best].push(cue.ru);
  }
  if (!assigned.some(lines => lines.length)) throw new Error("Таймкоды SRT не совпали с репликами. Проверь версию фильма.");
  return entries.map((entry, index) => entry.ru || !assigned[index].length ? entry :
    { ...entry, ru: assigned[index].join(" ") });
}

async function loadPhrases() {
  const transcript = transcriptInput.files[0];
  const subtitles = subtitleInput.files[0];
  let data;
  try {
    data = JSON.parse(await transcript.text());
  } catch {
    throw new Error("Не удалось прочитать JSON с таймкодами.");
  }
  const entries = parseTranscript(data);
  return subtitles ? addSubtitles(entries, readSrt(await subtitles.text())) : entries;
}

function formatTime(seconds) {
  const total = Math.floor(seconds || 0);
  const minutes = String(Math.floor(total / 60) % 60).padStart(2, "0");
  const remainder = String(total % 60).padStart(2, "0");
  return total >= 3600 ? `${Math.floor(total / 3600)}:${minutes}:${remainder}` : `${minutes}:${remainder}`;
}

function updateCaptions() {
  const index = reviewIndex >= 0 ? reviewIndex : phraseAt(phrases, video.currentTime);
  const last = reviewIndex >= 0 ? reviewLastIndex : index;
  const phrase = phrases[index];
  const active = phrase && (reviewIndex >= 0 || video.currentTime < phrase.end);
  $("captions").hidden = !captionsVisible || !active;
  const key = `${index}:${last}`;
  if (renderedCaption === key) return;
  renderedCaption = key;
  const text = $("captionText");
  text.replaceChildren();
  for (let phraseIndex = index; phraseIndex >= 0 && phraseIndex <= last; phraseIndex++) {
    const entry = phrases[phraseIndex];
    if (!entry) continue;
    const line = document.createElement("span");
    line.className = "caption-line";
    line.style.display = "block";
    if (!entry.words?.length) line.textContent = entry.en;
    else for (const [wordIndex, word] of entry.words.entries()) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "caption-word";
      button.textContent = word.text;
      button.title = "Прослушать слово";
      button.addEventListener("click", event => {
        event.stopPropagation();
        playWord(phraseIndex, wordIndex);
      });
      line.append(button, " ");
    }
    text.append(line);
  }
}

function playWord(index, wordIndex) {
  const phrase = phrases[index];
  const word = phrase?.words?.[wordIndex];
  if (!word || timeline.disabled) return;
  savePosition(true);
  reviewIndex = index;
  reviewLastIndex = index;
  reachedEnd = false;
  wordPlayback = {
    start: Math.max(0, word.start - 0.08),
    end: Math.min(video.duration, word.end + 0.06, phrase.words[wordIndex + 1]?.start ?? Infinity)
  };
  // Overlapping words can start before the preceding word has finished.
  wordPlayback.end = Math.max(word.end, wordPlayback.end);
  showReview();
  video.currentTime = wordPlayback.start;
  playVideo();
}

function updateTimeline() {
  showReview();
  if (scrubbing) return;
  timeline.value = video.currentTime;
  timeline.setAttribute("aria-valuetext", formatTime(video.currentTime));
  $("time").textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  $("repeat").disabled = phraseAt(phrases, video.currentTime) < 0;
}

function selectedPhraseIndex() {
  return reviewIndex >= 0 ? reviewIndex : phraseAt(phrases, video.currentTime);
}

function showReview() {
  updateCaptions();
  const index = selectedPhraseIndex();
  if (index !== displayedPhraseIndex) translationVisible = false;
  displayedPhraseIndex = index;
  const phrase = phrases[index];
  const ready = !!phrase && !timeline.disabled;
  $("phraseInfo").textContent = phrase
    ? `Фраза ${index + 1} из ${phrases.length} · ${formatTime(phrase.start)}`
    : "До первой реплики";
  $("previous").disabled = !ready || index === 0;
  $("next").disabled = timeline.disabled || !phrases[(reviewIndex >= 0 ? reviewLastIndex : index) + 1];
  $("split").disabled = !ready;
  $("lock").disabled = !ready;
  $("splitLabel").textContent = splitCount ? `Split: ${splitCount}` : "Split";
  $("split").setAttribute("aria-pressed", String(splitCount > 0));
  $("lockLabel").textContent = splitLock ? "Lock ✓" : "Lock";
  $("lock").setAttribute("aria-pressed", String(splitLock));
  $("again").disabled = !ready;
  $("ru").disabled = !ready;
  $("continue").disabled = timeline.disabled;
  $("ru").setAttribute("aria-pressed", String(translationVisible));
  $("translation").hidden = !translationVisible || !ready;
  const last = reviewIndex >= 0 ? reviewLastIndex : index;
  $("translation").textContent = phrases.slice(Math.max(0, index), last + 1).map(entry => entry.ru || "Для этой реплики перевод не добавлен.").join(" / ");
}

function changeSpeed(delta) {
  playbackSpeed = Math.min(2, Math.max(0.25, playbackSpeed + delta));
  video.playbackRate = playbackSpeed;
  $("speed").textContent = `${Number(playbackSpeed.toFixed(2))}×`;
  $("slower").disabled = playbackSpeed === 0.25;
  $("faster").disabled = playbackSpeed === 2;
}

async function requestWakeLock() {
  if (player.hidden || document.visibilityState !== "visible" || wakeLock || wakePending) return;
  if (!navigator.wakeLock) {
    $("wakeStatus").textContent = "Браузер не поддерживает удержание экрана включённым.";
    return;
  }
  wakePending = true;
  const session = wakeSession;
  try {
    const lock = await navigator.wakeLock.request("screen");
    if (player.hidden || document.visibilityState !== "visible" || session !== wakeSession) {
      await lock.release();
      return;
    }
    wakeLock = lock;
    $("wakeStatus").textContent = "";
    lock.addEventListener("release", () => {
      if (wakeLock !== lock) return;
      wakeLock = undefined;
      if (!player.hidden && document.visibilityState === "visible") {
        $("wakeStatus").textContent = "Удержание экрана отключено системой. Нажми любую кнопку плеера для повторной попытки.";
      }
    });
  } catch {
    if (!player.hidden && document.visibilityState === "visible") {
      $("wakeStatus").textContent = "Не удалось удержать экран включённым. Проверь энергосбережение телефона.";
    }
  } finally {
    wakePending = false;
  }
}

function releaseWakeLock() {
  const lock = wakeLock;
  wakeLock = undefined;
  if (lock) lock.release().catch(() => {});
}

function playVideo() {
  $("playerError").textContent = "";
  requestWakeLock();
  video.playbackRate = playbackSpeed;
  video.play().catch(error => {
    if (error.name !== "AbortError") $("playerError").textContent = "Не удалось воспроизвести файл. Попробуй MP4 с английской дорожкой.";
  });
}

function repeatPhrase(index, count = splitLock ? splitCount : 1) {
  if (!phrases[index]) return;
  savePosition(true);
  reviewIndex = index;
  reachedEnd = false;
  wordPlayback = undefined;
  reviewLastIndex = Math.min(index + Math.max(1, count) - 1, phrases.length - 1);
  showReview();
  video.currentTime = phrases[index].start;
  playVideo();
}

function continueMovie(shouldPlay) {
  const end = reachedEnd && reviewIndex >= 0 ? wordPlayback?.end ?? phrases[reviewLastIndex].end : video.currentTime;
  reviewIndex = -1;
  reachedEnd = false;
  wordPlayback = undefined;
  showReview();
  if (video.currentTime !== end) video.currentTime = end;
  if (shouldPlay) playVideo();
}

function stopAtPhraseEnd() {
  if (reviewIndex < 0 || reachedEnd || video.paused || video.seeking) return;
  const end = wordPlayback?.end ?? phrases[reviewLastIndex].end;
  if (video.currentTime < end) return;
  reachedEnd = true;
  video.pause();
  if (video.currentTime > end) video.currentTime = end;
}

function tick() {
  stopAtPhraseEnd();
  if (!video.paused) frame = requestAnimationFrame(tick);
}

function savePosition(force = false) {
  if (!positionKey || !Number.isFinite(video.duration) || reviewIndex >= 0 || video.seeking) return;
  const now = Date.now();
  if (!force && now - lastSavedAt < 3000) return;
  lastSavedAt = now;
  try {
    localStorage.setItem(positionKey, String(video.ended ? 0 : video.currentTime));
  } catch {
    // Browser storage can be disabled or unavailable for locally opened pages.
  }
}

function restorePosition() {
  try {
    return Number(localStorage.getItem(positionKey));
  } catch {
    return 0;
  }
}

function refreshFileButtons() {
  $("open").disabled = !(movieInput.files.length && transcriptInput.files.length);
  $("export").disabled = !transcriptInput.files.length;
}

async function useTranscript(button, action) {
  $("open").disabled = true;
  $("export").disabled = true;
  for (const input of [movieInput, transcriptInput, subtitleInput]) input.disabled = true;
  button.setAttribute("aria-busy", "true");
  $("feedback").textContent = "";
  try {
    await action(await loadPhrases());
  } catch (error) {
    $("feedback").textContent = error.message;
  } finally {
    button.removeAttribute("aria-busy");
    for (const input of [movieInput, transcriptInput, subtitleInput]) input.disabled = false;
    refreshFileButtons();
  }
}

function openMovie(entries) {
  const file = movieInput.files[0];
  phrases = entries;
  renderedCaption = undefined;
  reviewLastIndex = -1;
  reviewIndex = -1;
  reachedEnd = false;
  scrubbing = false;
  displayedPhraseIndex = -1;
  translationVisible = false;
  lastSavedAt = 0;
  positionKey = `shadowing-film:${file.name}:${file.size}:${file.lastModified}`;
  objectUrl = URL.createObjectURL(file);
  $("movieName").textContent = file.name;
  $("playerError").textContent = "";
  $("play").disabled = true;
  $("repeat").disabled = true;
  timeline.disabled = true;
  $("setup").hidden = true;
  player.hidden = false;
  document.body.classList.add("watching");
  showReview();
  video.src = objectUrl;
  video.playbackRate = playbackSpeed;
  requestWakeLock();
}

function closeMovie() {
  wakeSession++;
  releaseWakeLock();
  document.body.classList.remove("watching");
  savePosition(true);
  if (document.fullscreenElement === player) document.exitFullscreen().catch(() => {});
  video.pause();
  video.removeAttribute("src");
  video.load();
  URL.revokeObjectURL(objectUrl);
  positionKey = undefined;
  player.hidden = true;
  $("setup").hidden = false;
  $("open").focus();
}

for (const input of [movieInput, transcriptInput, subtitleInput]) {
  input.addEventListener("change", refreshFileButtons);
}
$("open").addEventListener("click", () => useTranscript($("open"), openMovie));
$("export").addEventListener("click", () => useTranscript($("export"), entries => {
  const json = JSON.stringify({ version: 1, phrases: entries }, null, 2);
  const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = `${transcriptInput.files[0].name.replace(/\.json$/i, "")}.movie.json`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $("feedback").textContent = `Реплик: ${entries.length}. С переводом: ${entries.filter(entry => entry.ru).length}.`;
}));
$("change").addEventListener("click", closeMovie);
$("en").addEventListener("click", () => {
  captionsVisible = !captionsVisible;
  $("en").setAttribute("aria-pressed", String(captionsVisible));
  updateCaptions();
});
function togglePlayback() {
  if ($("play").disabled) return;
  if (!video.paused) video.pause();
  else if (reachedEnd) continueMovie(true);
  else playVideo();
}
$("play").addEventListener("click", togglePlayback);
video.addEventListener("click", togglePlayback);
$("repeat").addEventListener("click", () => repeatPhrase(phraseAt(phrases, video.currentTime)));
$("previous").addEventListener("click", () => {
  if (reviewIndex >= 0 && reviewLastIndex > reviewIndex && !splitLock) repeatPhrase(reviewIndex, 1);
  else repeatPhrase(Math.max(0, selectedPhraseIndex() - (splitLock ? Math.max(1, splitCount) : 1)));
});
$("again").addEventListener("click", () => repeatPhrase(selectedPhraseIndex(), reviewIndex >= 0 ? reviewLastIndex - reviewIndex + 1 : 1));
$("next").addEventListener("click", () => repeatPhrase((reviewIndex >= 0 ? reviewLastIndex : selectedPhraseIndex()) + 1));
$("split").addEventListener("click", () => {
  splitCount = splitCount === 0 ? 2 : splitCount === 2 ? 3 : 0;
  if (!splitCount) splitLock = false;
  repeatPhrase(selectedPhraseIndex(), splitCount || 1);
});
$("lock").addEventListener("click", () => {
  splitLock = !splitLock;
  if (splitLock && !splitCount) splitCount = 2;
  repeatPhrase(selectedPhraseIndex(), splitLock ? splitCount : 1);
});
$("continue").addEventListener("click", () => continueMovie(true));
$("ru").addEventListener("click", () => {
  translationVisible = !translationVisible;
  showReview();
});
$("slower").addEventListener("click", () => changeSpeed(-0.25));
$("faster").addEventListener("click", () => changeSpeed(0.25));
player.addEventListener("click", () => requestWakeLock());
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
  else savePosition(true);
});


if (document.fullscreenEnabled && player.requestFullscreen) {
  $("fullscreen").hidden = false;
  $("fullscreen").addEventListener("click", () => {
    const change = document.fullscreenElement === player ? document.exitFullscreen() : player.requestFullscreen();
    change.catch(() => { $("playerError").textContent = "Полноэкранный режим недоступен в этом браузере."; });
  });
  document.addEventListener("fullscreenchange", () => {
    $("fullscreen").textContent = document.fullscreenElement === player ? "Выйти из полного экрана" : "На весь экран";
  });
}

timeline.addEventListener("input", () => {
  scrubbing = true;
  const target = Number(timeline.value);
  timeline.setAttribute("aria-valuetext", formatTime(target));
  $("time").textContent = `${formatTime(target)} / ${formatTime(video.duration)}`;
});
timeline.addEventListener("change", () => {
  const target = Number(timeline.value);
  scrubbing = false;
  continueMovie(false);
  video.currentTime = target;
  updateTimeline();
});

video.addEventListener("loadedmetadata", () => {
  video.playbackRate = playbackSpeed;
  if (!Number.isFinite(video.duration) || video.duration <= 0) {
    $("playerError").textContent = "Не удалось определить длительность фильма.";
    return;
  }
  let maxEnd = 0;
  phrases = phrases.filter(phrase => phrase.start < video.duration).map(phrase => {
    const end = Math.min(phrase.end, video.duration);
    maxEnd = Math.max(maxEnd, end);
    return { ...phrase, end, maxEnd };
  });
  if (!phrases.length) $("playerError").textContent = "Таймкоды из JSON выходят за пределы фильма.";
  const saved = restorePosition();
  if (saved > 0 && saved < video.duration) video.currentTime = saved;
  $("play").disabled = false;
  timeline.max = video.duration;
  timeline.disabled = false;
  updateTimeline();
});
video.addEventListener("error", () => {
  if (!player.hidden && video.getAttribute("src")) {
    $("playerError").textContent = "Браузер не открыл этот файл. Попробуй MP4 (H.264 с AAC).";
  }
});
video.addEventListener("play", () => {
  $("playLabel").textContent = "Pause";
  $("play").querySelector(".icon").textContent = "⏸";
  cancelAnimationFrame(frame);
  frame = requestAnimationFrame(tick);
});
video.addEventListener("pause", () => {
  $("playLabel").textContent = "Play";
  $("play").querySelector(".icon").textContent = "▶";
  cancelAnimationFrame(frame);
  savePosition(true);
});
video.addEventListener("timeupdate", () => {
  stopAtPhraseEnd();
  updateTimeline();
  savePosition();
});
video.addEventListener("seeked", () => {
  updateTimeline();
  savePosition(true);
});
video.addEventListener("ended", () => {
  if (reviewIndex >= 0) reachedEnd = true;
  savePosition(true);
});
window.addEventListener("pagehide", () => {
  savePosition(true);
  releaseWakeLock();
});
window.addEventListener("pageshow", () => requestWakeLock());
refreshFileButtons();
</script>
</body>
</html>

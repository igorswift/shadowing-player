name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-build/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compile APK
        run: gradle -p android-build assembleDebug
      - name: Test phone controls
        run: python3 android-build/test_mobile.py
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-build/app/build/outputs/apk/debug/app-debug.apk
          cp android-build/app/build/outputs/apk/debug/app-debug.apk ShadowingPlayer-1.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowingPlayer-1.3
          path: ShadowingPlayer-1.3.apk
      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.3 >/dev/null 2>&1; then
            gh release upload android-v1.3 ShadowingPlayer-1.3.apk --clobber
          else
            gh release create android-v1.3 ShadowingPlayer-1.3.apk --title 'Shadowing Player Android 1.3' --notes 'Touch playback controls and translations for every split phrase.' --target "$GITHUB_SHA"
          fi

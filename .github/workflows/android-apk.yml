name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-build/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        run: gradle -p android-build assembleDebug
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-build/app/build/outputs/apk/debug/app-debug.apk
          cp android-build/app/build/outputs/apk/debug/app-debug.apk ShadowingPlayer-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowingPlayer-1.0
          path: ShadowingPlayer-1.0.apk
      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0 >/dev/null 2>&1; then
            gh release upload android-v1.0 ShadowingPlayer-1.0.apk --clobber
          else
            gh release create android-v1.0 ShadowingPlayer-1.0.apk --title 'Shadowing Player Android 1.0' --notes 'First Android APK. Includes the Continuous player, local media library, saved progress and offline translation after model download.' --target "$GITHUB_SHA"
          fi
